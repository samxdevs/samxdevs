<title id="t">Stack</title>
<desc id="d">Languages: Python, TypeScript, JavaScript, Java, C++. Vision &amp; Ml: YOLOv8, MobileFaceNet · TFLite, Google ML Kit, scikit-learn, LangChain · RAG, Gemini API. Edge &amp; Hardware: Raspberry Pi 4, Jetson Nano, ESP32 · Arduino UNO, L298N · servos · DC motors, Pi camera streaming, serial · SSH · Wi-Fi AP. Apps: React Native · Expo, React · Vite, TypeScript, Capacitor, Three.js, Zustand · Firebase. Backend &amp; Data: FastAPI · Flask, PostgreSQL · SQLite, Redis · MongoDB, Kafka, Docker Compose, FAISS · ChromaDB.</desc>
